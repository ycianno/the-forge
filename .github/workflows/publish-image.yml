name: publish-image

# Builds and publishes a multi-arch (amd64 + arm64) image to GitHub Container
# Registry on every push to main and on version tags.
#
# NOTE: the first published package is PRIVATE by default. After the first
# successful run, open the package settings on GitHub and "Change visibility ->
# Public" so others can `docker pull` it without authenticating.

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Syntax check
        run: npm run check:syntax

      - name: Regression test
        run: npm test

      # THE GATE. This workflow used to run the unit tests and then publish, and
      # the unit tests all execute against the source tree — so they said nothing
      # about whether the built image could start. On 2026-08-27 the container
      # died on boot with MODULE_NOT_FOUND (the Dockerfile never copied a module
      # server.js required), docker-build.yml caught it, and this workflow pushed
      # that image to :latest regardless, because the two are independent jobs on
      # the same trigger.
      #
      # Nothing consumes :latest automatically, so nothing broke. That was luck.
      # A single-arch image is built and booted here BEFORE anything is pushed,
      # so a container that cannot start can no longer be published.
      - name: Build image for the gate
        run: docker build -t the-forge:gate .

      - name: Gate — the image must actually boot and serve
        run: |
          docker run -d --name forge-gate -e APP_PASSWORD=ci -p 3007:3007 the-forge:gate
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3007/login.html >/dev/null; then
              echo "image boots and serves — safe to publish"
              docker rm -f forge-gate >/dev/null 2>&1 || true
              exit 0
            fi
            sleep 1
          done
          echo "REFUSING TO PUBLISH: the image did not come up"
          docker logs forge-gate
          exit 1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
